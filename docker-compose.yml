services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://todo:todo@db:5432/todo
      SECRET_KEY: local-dev-only
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
